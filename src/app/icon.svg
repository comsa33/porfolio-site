<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Ink tile with the site's single accent dot. Flips to a light tile on dark UIs. -->
  <style>
    .tile { fill: #0f0f0f; }
    @media (prefers-color-scheme: dark) { .tile { fill: #f2f2f2; } }
  </style>
  <rect class="tile" width="64" height="64" rx="16"/>
  <circle cx="32" cy="32" r="9" fill="#ff6a00"/>
</svg>
